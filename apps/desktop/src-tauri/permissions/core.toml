[[permission]]
identifier = "allow-core-request"
description = "Allow the local main window to request allowlisted core operations."
commands.allow = ["core_request"]

[[permission]]
identifier = "allow-connection-status"
description = "Expose connection readiness without credential values."
commands.allow = ["connection_status"]

[[permission]]
identifier = "allow-open-panel"
description = "Open a validated built-in Jarvis panel; no arbitrary URL or external content."
commands.allow = ["open_panel"]

[[permission]]
identifier = "allow-workspace-action"
description = "Control the calling native window and save/restore bounded UI arrangements."
commands.allow = ["workspace_action"]

[[permission]]
identifier = "allow-export-specification"
description = "Export a Core-verified approved specification into a host-defined immutable document folder."
commands.allow = ["export_specification"]
